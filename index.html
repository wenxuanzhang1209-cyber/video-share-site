<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>视频</title>
    <style>
      :root {
        background: #000;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
      }

      video {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <video
      controls
      playsinline
      webkit-playsinline
      preload="auto"
      poster="assets/poster.jpg"
      aria-label="视频播放器"
    >
      <source src="assets/video.mp4" type="video/mp4" />
    </video>
  </body>
</html>
